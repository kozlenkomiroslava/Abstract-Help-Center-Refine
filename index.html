<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <header>
        <div class="brand">
            <a href="https://www.abstract.com/">
                <img id="logo" src="https://abstract-help-page-taupe.vercel.app/logo.svg" alt="logo">
            </a>
            <span class="divider"></span>
            <a class="help-center" href="https://abstract-help-page-taupe.vercel.app/">Help Center</a>
        </div>
        <div class="buttons">
            <button id="submit">Submit a request</button>
            <button id="signIn">Sign In</button>
        </div>
    </header>

    <main>
        <div class="welcome">
            <h1>How can we help?</h1>
            <div class="search">
                <input type="text" name="input" placeholder="Search">
                <i class="bx bx-right-arrow-alt bx-md"></i>
            </div>
        </div>
    </main>
    
    <footer>

    </footer>
    <script src="./script.js"></script>
</body>
</html>
